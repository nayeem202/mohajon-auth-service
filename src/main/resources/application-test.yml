spring:
  datasource:
    url: jdbc:h2:mem:authdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

app:
  otp:
    store: memory
  google:
    client-id: "test-client.apps.googleusercontent.com"

logging:
  level:
    com.authservice: INFO
